name: Android release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci --legacy-peer-deps
        working-directory: client
      - run: npm run build
        working-directory: client
      - run: npx cap sync android
        working-directory: client
      # google-services.json is NOT committed. Add it as a GitHub secret
      # named GOOGLE_SERVICES_JSON (base64) and uncomment the next step
      # to write it to client/android/app/google-services.json before
      # the Gradle build. Without it the APK builds but Firebase Auth
      # on Android will not work.
      # - run: echo "$GOOGLE_SERVICES_JSON" | base64 -d > android/app/google-services.json
      #   working-directory: client
      #   env:
      #     GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
      - run: ./gradlew assembleDebug --stacktrace
        working-directory: client/android
      - uses: actions/upload-artifact@v4
        with:
          name: petals-apk
          path: client/android/app/build/outputs/apk/debug/app-debug.apk
      - if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: client/android/app/build/outputs/apk/debug/app-debug.apk
          generate_release_notes: true
