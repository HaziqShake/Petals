name: CI
on:
  push:
    branches: [main, test-release]
  pull_request:
    branches: [main, test-release]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci --legacy-peer-deps
        working-directory: client
      - run: npx tsc -b
        working-directory: client
      - run: npm run lint
        working-directory: client
      - run: npm run build
        working-directory: client
